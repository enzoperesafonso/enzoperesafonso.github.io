# BVI Outreach models (the "BVI Outreach" section of models.html).
# Same fields as models.yml. Tactile sets made with AstroTouch for blind and
# visually impaired audiences, with braille and text labels.

- title: Galaxy morphology
  badge: Tactile set
  image: /assets/images/models/galaxy_morphology.jpg
  image_alt: Rendered pair of tactile plaques for an Sc spiral galaxy, an idealised spiral beside the real galaxy M74, each with a braille label
  summary: >-
    Plaques for the eight Hubble galaxy classes, from round ellipticals to
    barred spirals and irregulars. Each class comes as an idealised plaque,
    to learn the shape by touch, paired with a real galaxy from the DESI
    Legacy Survey, plus hand-held 3D shapes showing how thick each kind of
    galaxy really is.
  details: [16 plaques + 3D shapes, Braille and text labels]

- title: Centaurus A in four kinds of light
  badge: Multiwavelength
  image: /assets/images/models/centaurus_a.jpg
  image_alt: Rendered set of four tactile plaques of Centaurus A in radio, infrared, visible and ultraviolet light
  summary: >-
    The same patch of sky around the active galaxy Centaurus A in radio,
    infrared, visible and ultraviolet light, at the same scale and position,
    so features can be lined up by touch: the black hole's radio lobes, the
    warped dust disc and the young stars forming inside it.
  details: [4 plaques, "SUMSS, WISE, DSS2, GALEX"]

- title: Wolf-Rayet 140
  badge: JWST
  image: /assets/images/models/wr140.jpg
  image_alt: Rendered tactile plaque of WR 140, with a fan of parallel curved ridges spreading out from the stars
  summary: >-
    JWST's mid-infrared image of a pair of massive stars whose colliding
    winds make a new dust shell every 8-year orbit. The shells become a fan
    of parallel curved ridges, like tree rings you can count with a finger.
  details: [JWST MIRI data, Braille and text labels]

- title: "GW150914: feel a gravitational wave"
  badge: Gravitational waves
  image: /assets/images/models/gw150914.jpg
  image_alt: Rendered tactile plaque of the GW150914 signal, with a ridged strip above a raised wave that grows faster and taller before ringing down
  summary: >-
    The first gravitational wave ever detected, from two merging black
    holes. Running a finger left to right plays back the last tenth of a
    second: slow waves, the rising chirp, the merger and the ringdown. A
    second plaque sets what LIGO measured beside Einstein's prediction.
  details: [LIGO data, 2 plaques]

- title: Planet globes
  badge: Planetary
  image: /assets/images/models/planet_globes.jpg
  image_alt: Rendered tactile globes of Mars, Jupiter and Earth, showing Mars's volcanoes and canyon, Jupiter's cloud bands and Earth's continents
  summary: >-
    Hand-held globes of Mars, Jupiter, Earth, the Moon and Saturn made from
    real global maps: Olympus Mons and Valles Marineris on Mars, the Great
    Red Spot and cloud belts on Jupiter, and Earth's mountain ranges and
    mid-ocean ridges. Each prints in two halves without supports.
  details: [5 globes, "MOLA, LOLA, ETOPO1, Hubble OPAL"]
