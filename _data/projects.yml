# Projects page. Each item appears under its category, in the order written.
#
# Fields (only title, category and summary are required):
#   id          short-name, used for #anchor links
#   title       project name
#   category    one of the category ids below
#   years       e.g. "2024 – present"
#   org         where / who with
#   featured    true = also listed on the homepage (keep it to about 4)
#   short       one-line description used in that homepage list
#   summary     1–3 sentences, Markdown allowed
#   role        optional "what I did" line
#   tags        list of tools / keywords
#   image       path to a photo or screenshot (shown as a small thumbnail)
#   image_alt   describe the image for screen readers
#   image_logo  true for a logo or graphic (shown without a border)
#   video       YouTube video id (shows the thumbnail instead of an image)
#   links       list of { label, url }
#   page        path to a longer write-up page (the title links to it)

categories:
  - id: instrumentation
    title: Telescopes & instrumentation
    description: Control software, drivers and hardware for robotic telescopes.
  - id: automation
    title: Automation, ML & tools
    description: Pipelines and tools that take manual work out of observing.
  - id: fun
    title: Fun projects
    description: Hardware and software built for the joy of it, mostly to understand something better.
  - id: accessibility
    title: Accessible astronomy
    description: Turning astronomical data into things people can touch.

items:
  - id: rotse-ocs
    title: ROTSE-IIIc observatory control system
    category: instrumentation
    years: 2024 – present
    org: SAAO
    featured: true
    short: rebuilding the control software of a 20-year-old robotic telescope in Namibia
    summary: >-
      Bringing a 20-year-old robotic telescope in Namibia back online. I
      designed a new observatory control system on the pyobs framework to
      replace the defunct legacy C software, with asynchronous interfaces
      that let the original hardware and modern components work together.
    tags: [Python, pyobs, asyncio, Robotic telescopes]
    page: /projects/rotse.html
    image: /assets/images/projects/rotse-logo.png
    image_alt: ROTSE Namibia logo
    image_logo: true
    links:
      - label: Read more
        url: /projects/rotse.html
      - label: pyobs
        url: https://www.pyobs.org


  - id: weather-station
    title: Open weather station & all-sky camera
    category: instrumentation
    years: 2024 – present
    org: ROTSE-IIIc, Namibia · SAAO
    page: /projects/weather-station.html
    summary: >-
      A low-cost, open environmental monitoring suite for robotic telescopes: a
      3D-printed weather station with an anemometer and radiation screens, a
      custom all-sky camera that watches for cloud, and firmware that serves
      the telemetry a telescope needs to decide whether it can open. Built for
      the ROTSE-IIIc revival, now growing into AtmoPi, a custom Raspberry Pi
      board for the next version.
    tags: [Fusion 360, 3D printing, MicroPython, Raspberry Pi, KiCad, Telemetry]
    image: /assets/projects/weather-station/thumb.png
    image_alt: Render of the 3D-printed weather station with its three-cup anemometer
    image_logo: true
    links:
      - label: Read more
        url: /projects/weather-station.html

  - id: dome-meteo
    title: Dome weather sensor network
    category: instrumentation
    years: 2026
    org: SAAO Intelligent Observatory
    page: /projects/dome-meteorology.html
    summary: >-
      Power-over-Ethernet sensor nodes that measure temperature, humidity and
      pressure inside SAAO's telescope domes. I wrote the ESP32 firmware, which
      serves each reading as JSON on the observatory network, and designed the
      3D-printed housing in Fusion 360.
    tags: [ESP32, C++, Power over Ethernet, Fusion 360, Python]
    image: /assets/projects/dome-meteo/thumb.png
    image_alt: Render of the sensor node's printed housing, with the SAAO IO logo on its vented lid and the sensor pod beside it
    image_logo: true
    links:
      - label: Read more and explore the 3D model
        url: /projects/dome-meteorology.html

  - id: lesedi-preflight
    title: Automating Lesedi's nightly pre-flight
    category: automation
    years: 2024 – present
    org: SAAO Intelligent Observatory
    featured: true
    short: automating the nightly start-up of the Lesedi telescope, from reading the sky to calibrations
    summary: >-
      Every night on the 1-metre Lesedi telescope starts with the same
      routine: work out what the sky is doing, then take flat fields and
      spectrophotometric standards. I automated it. A computer-vision pipeline
      detects cloud in all-sky camera images in real time, so the observatory
      software knows the sky conditions without someone looking up, and the
      calibrations are scheduled automatically instead of by hand.
    tags: [Python, Computer vision, Deep learning, Scheduling, Calibration]

  - id: saltshaker
    title: SALTshaker
    category: automation
    years: 2025 – present
    summary: >-
      A Python package for planning astronomical observations with the
      Southern African Large Telescope (SALT).
    tags: [Python, Observation planning, SALT]
    links:
      - label: GitHub
        url: https://github.com/enzoperesafonso/SALTshaker
      - label: Docs
        url: https://saltishaker.readthedocs.io/

  - id: astropanel
    title: "AstroPanel: live astronomy on an LED panel"
    category: fun
    years: 2026
    page: /projects/astropanel.html
    summary: >-
      A 64×32 RGB LED panel on my bookshelf that shows what the sky is doing
      right now: sidereal time and tonight's darkness, the ISS, Voyager's
      light-time, the live Sun, and gravitational-wave and gamma-ray burst
      alerts that take over the panel, plus a few pixel-art screensavers. It
      started on a Raspberry Pi Pico 2 W and now runs on a Raspberry Pi 3,
      wired straight to the panel.
    tags: [Raspberry Pi, Python, CircuitPython, HUB75, rpi-rgb-led-matrix]
    image: /assets/projects/astropanel/thumb.jpg
    image_alt: The LED panel showing UTC, sidereal and local time, the Moon and "DARK FOR 6:10"
    links:
      - label: Read more
        url: /projects/astropanel.html

  - id: fornax
    title: "Fornax A: a merger simulation"
    category: fun
    years: 2026
    featured: true
    short: an excuse to learn C, by crashing two galaxies together
    page: /projects/fornax.html
    summary: >-
      I wanted to learn C, so I wrote a Barnes–Hut N-body code from scratch and
      used it to crash two galaxies together the way NGC 1316 is thought to have
      formed. It's gravity only, so an exploration rather than a research
      result, but the galaxies and their orbit are set from published
      measurements and I check what comes out against the real thing.
    tags: [C, OpenMP, N-body, Python, Galaxy mergers]
    image: /assets/projects/fornax/thumb.jpg
    image_alt: Simulated cold-gas tidal tails coloured by line-of-sight velocity
    links:
      - label: Read the write-up
        url: /projects/fornax.html

  - id: overhead
    title: "Overhead: print the sky from any moment"
    category: fun
    years: 2026
    featured: true
    short: "a free star map maker: posters, planispheres and sky charts as print-ready PDFs"
    page: /projects/overhead.html
    summary: >-
      A free, open-source star map maker. Give it a date, time and place and it
      draws the sky that was overhead, then exports a print-ready vector PDF:
      either a poster, a cut-out planisphere you can turn to any night of the
      year, or a chart of the sky for one evening. Constellations can be
      labelled with Southern African star names instead of the Latin ones. It
      runs entirely in the browser, with no backend and nothing uploaded.
    tags: [JavaScript, Astronomy, Vector PDF, Open source]
    image: /assets/projects/overhead/thumb.jpg
    image_alt: >-
      A circular star map of the Milky Way on deep blue, labelled with San star
      names
    links:
      - label: Try it
        url: https://enzoperesafonso.github.io/overhead/
      - label: GitHub
        url: https://github.com/enzoperesafonso/overhead
      - label: Read more
        url: /projects/overhead.html

  - id: astrotouch
    title: AstroTouch
    category: accessibility
    years: 2025 – present
    featured: true
    short: turning telescope images into 3D-printable tactile models
    summary: >-
      Open-source software that turns astronomical FITS images into
      3D-printable tactile models, so blind and visually impaired people can
      explore real telescope data. Also available as a web app, no install
      needed.
    tags: [Python, FITS, 3D printing, Accessibility]
    page: /projects/astrotouch.html
    image: /assets/images/models/jupiter_MIRI.jpg
    image_alt: A 3D-printed tactile relief of Jupiter made from JWST data
    links:
      - label: Read more
