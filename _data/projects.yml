# Projects page. Each item appears under its category, in the order written.
#
# Fields (only title, category and summary are required):
#   id          short-name, used for #anchor links
#   title       project name
#   category    one of the category ids below
#   years       e.g. "2024 – present"
#   org         where / who with
#   featured    true = also listed on the homepage (keep it to about 4)
#   short       one-line description used in that homepage list
#   summary     1–3 sentences, Markdown allowed
#   role        optional "what I did" line
#   tags        list of tools / keywords
#   image       path to a photo or screenshot (shown as a small thumbnail)
#   image_alt   describe the image for screen readers
#   image_logo  true for a logo or graphic (shown without a border)
#   video       YouTube video id (shows the thumbnail instead of an image)
#   links       list of { label, url }
#   page        path to a longer write-up page (the title links to it)

categories:
  - id: instrumentation
    title: Telescopes & instrumentation
    description: Control software, drivers and hardware for robotic telescopes.
  - id: automation
    title: Automation, ML & tools
    description: Pipelines and tools that take manual work out of observing.
  - id: simulations
    title: Simulations & interactive tools
    description: Models and visualisations, mostly built to understand something better.
  - id: accessibility
    title: Accessible astronomy
    description: Turning astronomical data into things people can touch.

items:
  - id: rotse-ocs
    title: ROTSE-IIIc observatory control system
    category: instrumentation
    years: 2024 – present
    org: SAAO
    featured: true
    short: rebuilding the control software of a 20-year-old robotic telescope in Namibia
    summary: >-
      Bringing a 20-year-old robotic telescope in Namibia back online. I
      designed a new observatory control system on the pyobs framework to
      replace the defunct legacy C software, with asynchronous interfaces
      that let the original hardware and modern components work together.
    tags: [Python, pyobs, asyncio, Robotic telescopes]
    page: /projects/rotse.html
    image: /assets/images/projects/rotse-logo.png
    image_alt: ROTSE Namibia logo
    image_logo: true
    links:
      - label: Read more
        url: /projects/rotse.html
      - label: pyobs
        url: https://www.pyobs.org


  - id: weather-station
    title: Open weather station & all-sky camera
    category: instrumentation
    years: 2024 – present
    org: ROTSE-III, Namibia · SAAO
    page: /projects/weather-station.html
    summary: >-
      A low-cost, open environmental monitoring suite for robotic telescopes: a
      3D-printed weather station with an anemometer and radiation screens, a
      custom all-sky camera that watches for cloud, and firmware that serves
      the telemetry a telescope needs to decide whether it can open. Built for
      the ROTSE-IIIc revival, now growing into AtmoPi, a custom Raspberry Pi
      board for the next version.
    tags: [Fusion 360, 3D printing, MicroPython, Raspberry Pi, KiCad, Telemetry]
    image: /assets/projects/weather-station/thumb.png
    image_alt: Render of the 3D-printed weather station with its three-cup anemometer
    image_logo: true
    links:
      - label: Read more
        url: /projects/weather-station.html

  - id: dome-meteo
    title: Dome weather sensor network
    category: instrumentation
    years: 2026
    org: SAAO Intelligent Observatory
    page: /projects/dome-meteorology.html
    summary: >-
      Power-over-Ethernet sensor nodes that measure temperature, humidity and
      pressure inside SAAO's telescope domes. I wrote the ESP32 firmware, which
      serves each reading as JSON on the observatory network, and designed the
      3D-printed housing in Fusion 360.
    tags: [ESP32, C++, Power over Ethernet, Fusion 360, Python]
    image: /assets/projects/dome-meteo/thumb.png
    image_alt: Render of the sensor node's printed housing, with the SAAO IO logo on its vented lid and the sensor pod beside it
    image_logo: true
    links:
      - label: Read more and explore the 3D model
        url: /projects/dome-meteorology.html

  - id: lesedi-preflight
    title: Automating Lesedi's nightly pre-flight
    category: automation
    years: 2024 – present
    org: SAAO Intelligent Observatory
    featured: true
    short: automating the nightly start-up of the Lesedi telescope, from reading the sky to calibrations
    summary: >-
      Every night on the 1-metre Lesedi telescope starts with the same
      routine: work out what the sky is doing, then take flat fields and
      spectrophotometric standards. I automated it. A computer-vision pipeline
      detects cloud in all-sky camera images in real time, so the observatory
      software knows the sky conditions without someone looking up, and the
      calibrations are scheduled automatically instead of by hand.
    tags: [Python, Computer vision, Deep learning, Scheduling, Calibration]

