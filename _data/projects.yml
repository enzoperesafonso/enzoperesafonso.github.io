  - id: fornax
    title: "Fornax A: a merger simulation"
    category: simulations
    years: 2026
    featured: true
    short: an excuse to learn C, by crashing two galaxies together
    page: /projects/fornax.html
    summary: >-
      A hobby project to learn C: I wrote a Barnes–Hut N-body code from
      scratch, then used it to crash two galaxies together the way NGC 1316 is
      thought to have formed. Gravity only, so it's exploratory rather than
      research, but the galaxies and their orbit are set up from published
      measurements, and I compare what comes out with the real thing.
    tags: [C, OpenMP, N-body, Python, Galaxy mergers]
    image: /assets/projects/fornax/thumb.jpg
    image_alt: Simulated cold-gas tidal tails coloured by line-of-sight velocity
    links:
      - label: Read the write-up
        url: /projects/fornax.html

  - id: asteroseismology
    title: Asteroseismology simulator
    category: simulations
    years: 2026
    featured: true
    short: explore how stars oscillate, in your browser
    summary: >-
      An interactive 3D model of stellar oscillations. Choose a star by
      spectral type or by T<sub>eff</sub> and log g, then explore how
      pulsation modes of different degree (l) and order (m) ripple across its
      surface.
    tags: [JavaScript, three.js, Stellar physics]
    image: /assets/images/projects/asteroseismology.jpg
    image_alt: A star and a spherical-harmonic oscillation pattern rendered in the simulator
    links:
      - label: Launch simulator
        url: /asteroseismology/

  - id: youtube-sims
    title: Simulations for YouTube
    category: simulations
    summary: >-
      Smaller simulations I've made to explain things on
      [my YouTube channel](https://www.youtube.com/@enzoperesafonso): what the
      transit of a habitable moon around a gas giant might look like (using
      Pandora from *Avatar* as the test case), and the gravitational waves from
      the GW170817 neutron-star merger, comparing LIGO/Virgo data with a
      theoretical waveform.
    tags: [Python, Simulation, Science communication]
    video: DhQAOK76zJE
    links:
      - label: Exomoon transit
        url: https://www.youtube.com/watch?v=DhQAOK76zJE
      - label: GW170817
        url: https://www.youtube.com/watch?v=ErgA0oa8CDE
      - label: All videos
        url: https://www.youtube.com/@enzoperesafonso

  - id: astrotouch
