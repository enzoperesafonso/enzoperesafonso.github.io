# Tactile 3D models (models.html).
#
# Optional interactive viewer: add `model:` pointing at a .glb file (and
# `model_alt:` describing it). A "View in 3D" button appears under the entry.
# `model_orbit:` optionally sets the starting camera angle.

- title: JWST Jupiter (MIRI)
  badge: Tactile data
  image: /assets/images/models/jupiter_MIRI.jpg
  image_alt: Tactile relief of Jupiter's cloud bands printed in white
  summary: >-
    A high-resolution tactile relief of Jupiter's cloud bands and Great Red
    Spot, made directly from James Webb Space Telescope MIRI data.
  details: [FITS to 3D, ~4 h print]
  link:
    label: Download files
    url: https://www.thingiverse.com/thing:7201284

- title: SALT scale model
  badge: Instrumentation
  image: /assets/images/models/salt_print.JPG
  image_alt: 3D-printed scale model of the Southern African Large Telescope
  summary: >-
    A scale model of the Southern African Large Telescope, including the
    segmented primary mirror and tracker assembly.
  details: [Multi-part assembly, ~12 h print]
  model: /assets/models/salt.glb
  model_alt: 3D model of the Southern African Large Telescope building and its tower, designed in Fusion 360
  model_orbit: 200deg 75deg auto   # starting camera angle: around, down from the top, distance
  link:
    label: Download files
    url: https://www.thingiverse.com/thing:7011667

