# Homepage content. Text fields accept Markdown (links, *italics*, **bold**).

greeting: Hello!

# First paragraph on the homepage. It is followed by your featured projects
# (featured: true in projects.yml) as a short bullet list.
intro: |
  What excites me most is the whole chain from sky to science: the
  telescopes that catch the light, the software that points them, and what the
  data turns out to say. Since 2024 I've helped revive ROTSE-IIIc, a robotic
  telescope in Namibia that sat dormant for nearly a decade; I designed its new
  control system, and it has been observing again since 2025. I also contribute
  to [pyobs](https://www.pyobs.org) and build tools for SAAO's Intelligent
  Observatory. Some of what I've worked on:

# Shown after the project list.
outro: |
  I also build side projects, like a [star map maker](https://enzoperesafonso.github.io/overhead/),
  and make [tactile models](/models.html) so blind and visually impaired people
  can explore real telescope data by touch. Next, I want to work on
  time-domain astronomy: robotic telescopes, transients, and machine learning
  for astronomical data.

