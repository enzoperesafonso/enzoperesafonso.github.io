greeting: Hello!

# First paragraph on the homepage. It is followed by your featured projects
# (featured: true in projects.yml) as a short bullet list.
intro: |
  I'm an Honours student in astrophysics at the University of Cape Town, and
  I'm mostly interested in the *how* of astronomy: the software, electronics
  and instruments that get light from the sky to the person trying to measure
  it. I learn by building things and finding out where they break. Since 2024
  I've been helping bring the ROTSE-IIIc telescope in Namibia back to life with
  the South African Astronomical Observatory, contributing to the open-source
  [pyobs](https://www.pyobs.org) observatory control system, and building tools
  for SAAO's Intelligent Observatory. Some of what I've worked on:

# Shown after the project list.
outro: |
  There's usually a side project on the go, because the best way I know to
  understand something is to try to build it: a galaxy-merger simulation I
  wrote to teach myself C, a [star map maker](/projects/overhead.html) anyone
  can use for free, a simulator for the way stars ring like bells. The other
  half of it is sharing the sky: I co-founded Zulelinye Outreach, and I make
  [tactile models](/models.html) so that blind and visually impaired people can
  explore real telescope data by touch.

  What I'd like to keep working on: observational astronomy, robotic telescopes
  and the software that runs them, transients (XRBs and CVs), and machine
  learning applied to astronomical data.

